<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.S. Weather Alerts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>National Weather Service Alerts</h1>

    <form id="weather-form">
      <label for="state-input">Enter U.S. State Abbreviation (e.g., MN):</label>
      <input type="text" id="state-input" placeholder="Enter state abbreviation" />
      <button type="submit" id="submit-btn">Get Weather Alerts</button>
    </form>

    <div id="error-message" class="hidden"></div>

    <div id="alerts-display"></div>

    <script src="index.js"></script>
  </body>
</html>
